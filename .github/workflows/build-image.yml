name: Build and Push Image

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  settings:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.env.outputs.sha }}
      push_latest: ${{ steps.env.outputs.push_latest }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup outputs
        id: env
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: settings
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only, no tag -- so no arch-suffixed tag ever exists in the registry.
      # The merge job below builds the real tags directly from these digests.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile.k8s
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/logflare/loadfest,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [settings, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          SHA: ${{ needs.settings.outputs.sha }}
        run: |
          docker buildx imagetools create -t ghcr.io/logflare/loadfest:$SHA \
            $(printf 'ghcr.io/logflare/loadfest@sha256:%s ' *)

      - name: Tag latest
        if: needs.settings.outputs.push_latest == 'true'
        env:
          SHA: ${{ needs.settings.outputs.sha }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/logflare/loadfest:latest \
            ghcr.io/logflare/loadfest:$SHA
