name: Build and Push Image

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  settings:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.env.outputs.sha }}
      push_latest: ${{ steps.env.outputs.push_latest }}
    steps:
      - uses: actions/checkout@v3
      - name: Setup outputs
        id: env
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "push_latest=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: settings
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile.k8s
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/logflare/loadfest:${{ needs.settings.outputs.sha }}-${{ matrix.arch }}

  merge:
    needs: [settings, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge multi-arch manifest
        env:
          SHA: ${{ needs.settings.outputs.sha }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/logflare/loadfest:$SHA \
            ghcr.io/logflare/loadfest:$SHA-amd64 \
            ghcr.io/logflare/loadfest:$SHA-arm64

      - name: Tag latest
        if: needs.settings.outputs.push_latest == 'true'
        env:
          SHA: ${{ needs.settings.outputs.sha }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/logflare/loadfest:latest \
            ghcr.io/logflare/loadfest:$SHA
