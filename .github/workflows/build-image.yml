name: Build and Push Image

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3

      - name: Setup outputs
        id: env
        run: |
          sha="$(git rev-parse HEAD)"
          tags="ghcr.io/logflare/loadfest:$sha"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            tags="$tags
          ghcr.io/logflare/loadfest:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile.k8s
          push: true
          tags: ${{ steps.env.outputs.tags }}
